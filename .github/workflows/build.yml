name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure SDK platform + licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          SM="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          ls "$SDK/platforms" || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Prepare keystore
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "KS_FILE=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"
            echo "使用仓库 secret 中的固定证书"
          else
            echo "KEYSTORE_BASE64 未配置，改用 CI 临时证书签名（可安装，但每次构建证书不同）"
            keytool -genkeypair -e -keystore "$GITHUB_WORKSPACE/release.jks" \
              -alias fuumod -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass fuumod123 -keypass fuumod123 \
              -dname "CN=FuuMod, OU=Lab, O=Lab, L=NA, ST=NA, C=CN" > /dev/null 2>&1
            echo "KS_FILE=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=fuumod123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=fuumod" >> "$GITHUB_ENV"
            echo "KEY_PASS=fuumod123" >> "$GITHUB_ENV"
          fi

      - name: Build release
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: fuumod-apk
          path: app/build/outputs/apk/release/*.apk
