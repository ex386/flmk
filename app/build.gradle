plugins {
    id 'com.android.application'
}

def envOr = { String name, String defVal ->
    def v = System.getenv(name)
    return (v != null && !v.trim().isEmpty()) ? v.trim() : defVal
}
def envKs = System.getenv("KS_FILE")
def repoKs = rootProject.file("keystore/fuumod.jks")
def ksFile = (envKs != null && !envKs.trim().isEmpty()) ? envKs.trim() : (repoKs.exists() ? repoKs.absolutePath : null)
def ksStorePass = envOr("KS_PASS", "fuumod123")
def ksAliasName = envOr("KEY_ALIAS", "fuumod")
def ksKeyPass = envOr("KEY_PASS", "fuumod123")
logger.lifecycle("FuuMod signing: " + (ksFile ?: "NONE"))

android {
    namespace 'com.lab.fuumod'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lab.fuumod'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (ksFile) {
            rel {
                storeFile file(ksFile)
                storePassword ksStorePass
                keyAlias ksAliasName
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.rel
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
}
